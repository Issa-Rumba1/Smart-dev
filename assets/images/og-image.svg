<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F47B20"/>
      <stop offset="100%" style="stop-color:#ffa85c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circle -->
  <circle cx="950" cy="315" r="280" fill="rgba(244,123,32,0.06)"/>
  <circle cx="950" cy="315" r="180" fill="rgba(244,123,32,0.06)"/>

  <!-- Logo badge -->
  <rect x="80" y="200" width="110" height="110" rx="22" fill="url(#accent)"/>
  <text x="135" y="272" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" text-anchor="middle" fill="white">SD</text>

  <!-- Brand name -->
  <text x="210" y="248" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="white" letter-spacing="4">SMART DEV</text>
  <text x="212" y="292" font-family="Arial, sans-serif" font-size="20" fill="#ffa85c" letter-spacing="2">Innovation. Technology. Digital Solutions.</text>

  <!-- Divider line -->
  <rect x="80" y="335" width="600" height="4" rx="2" fill="url(#accent)"/>

  <!-- Tagline -->
  <text x="80" y="395" font-family="Arial, sans-serif" font-size="26" fill="rgba(255,255,255,0.8)">Professional IT Services by Issa Nyamawi Rumba</text>

  <!-- Services row -->
  <text x="80" y="455" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.5)">Web Development  •  Networking  •  Database Management  •  IT Support  •  Graphic Design</text>

  <!-- Domain -->
  <text x="80" y="560" font-family="Arial, sans-serif" font-size="22" fill="#F47B20">smartdev.co.ke</text>
</svg>
